# ─────────────────────────────────────────────────────────────────────────────
#  PlayAnything — mpv profile
#  Managed file: PlayAnything rewrites this on upgrade.
#  Put your own overrides in user.conf (same folder); it is included last and
#  never touched.  Every option is documented at https://mpv.io/manual/stable/
# ─────────────────────────────────────────────────────────────────────────────

# ── Video output & GPU acceleration ──────────────────────────────────────────
# gpu-next = libplacebo renderer: 10/12-bit output, HDR tone-mapping, dithering.
vo=gpu-next
# Pick the native GPU API: D3D11 on Windows, Metal/OpenGL on macOS, Vulkan/OpenGL on Linux.
gpu-api=auto
# Hardware decoding (NVDEC / D3D11VA / VAAPI / VideoToolbox) when it is known to
# be safe, software fallback otherwise. Covers H.264, HEVC 8/10-bit, VP9, AV1, ProRes (macOS).
hwdec=auto-safe
# Let 10-bit panels receive 10-bit; dither cleanly for 8-bit ones.
dither-depth=auto
# HDR: pass HDR through to an HDR display, tone-map to SDR otherwise.
target-colorspace-hint=yes
tone-mapping=auto
hdr-compute-peak=auto
# Keep it light: no motion interpolation, default scalers.
interpolation=no
video-sync=audio
# Direct rendering into GPU-visible memory saves a copy on every frame.
vd-lavc-dr=auto
# Use every core for software decode of 8K / 10-bit material that lacks hw paths.
vd-lavc-threads=0

# ── Audio ────────────────────────────────────────────────────────────────────
# Output the file's channel layout when the device supports it (5.1/7.1 stems).
audio-channels=auto-safe
volume=100
volume-max=150
# Open a sibling .wav/.flac/.m4a with the same base name as an extra audio
# track (field recorders, dual-system sound, stems).
audio-file-auto=fuzzy
# Show embedded cover art for audio files.
audio-display=embedded-first

# ── Not-really-local files: Synology Drive / OneDrive placeholders, SMB, NAS ──
# Always keep a RAM cache so a slow or on-demand source never stalls the UI.
cache=yes
demuxer-max-bytes=512MiB
demuxer-max-back-bytes=128MiB
demuxer-readahead-secs=60
# Large reads = far fewer round trips over SMB/WebDAV/cloud filters.
stream-buffer-size=4MiB
# Don't pause forever waiting for data; resume as soon as 2 s is buffered.
cache-pause-wait=2
network-timeout=120

# ── Window & UI ──────────────────────────────────────────────────────────────
# Show the window instantly — before the file is even opened — so a cloud
# file that takes seconds to hydrate still feels like one click.
force-window=immediate
# Don't close when the file ends; stay for frame-stepping and screenshots.
keep-open=yes
autofit-larger=85%x85%
osc=yes
osd-bar=yes
osd-level=1
cursor-autohide=1000
title=${?media-title:${media-title}}${!media-title:PlayAnything} — PlayAnything
# Frame-exact seeking.
hr-seek=yes

# ── Images (JPEG/PNG/HEIC/TIFF/EXR... and camera-RAW previews) ────────────────
# Show a picture until you move on; < and > step through the folder.
image-display-duration=inf

# ── Subtitles ────────────────────────────────────────────────────────────────
sub-auto=fuzzy
slang=en,eng,de,fr,es,it,pt,ja,zh
sub-font-size=44

# ── Screenshots (press s) ────────────────────────────────────────────────────
screenshot-format=png
screenshot-png-compression=6
screenshot-high-bit-depth=yes
screenshot-directory=~~desktop/
screenshot-template="%F-%P"

# ── Misc ─────────────────────────────────────────────────────────────────────
# PlayAnything handles folders itself (see scripts/pa-autoload.lua).
directory-mode=lazy
# Don't ask youtube-dl about plain file paths; only URLs reach it anyway.
ytdl=yes
msg-level=all=warn

# ── Auto profiles ────────────────────────────────────────────────────────────
# Audio-only files: give them a sensible small window with the on-screen controller.
[pa-audio-only]
profile-cond=p["current-tracks/audio"] ~= nil and p["current-tracks/video"] == nil
profile-restore=copy
autofit=640x360
geometry=50%:50%

# Still images: no OSC auto-hiding fuss, loop nothing.
[pa-image]
profile-cond=p["current-tracks/video/image"] == true
profile-restore=copy
loop-file=no
osc=no

# Very high resolution footage (6K/8K) that fell back to software decode: trade
# a little quality for smoothness.
[pa-huge]
profile-cond=p["video-params/w"] ~= nil and p["video-params/w"] >= 5000 and p["hwdec-current"] == "no"
profile-restore=copy
scale=bilinear
cscale=bilinear
framedrop=decoder+vo

# Your overrides live here and survive upgrades. [default] re-opens the global
# section so the include applies everywhere, not just inside the last profile.
[default]
include=~~/user.conf
