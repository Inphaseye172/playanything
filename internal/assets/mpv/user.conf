# PlayAnything — your personal mpv overrides.
# This file is included after the managed mpv.conf and is never overwritten.
# Anything from https://mpv.io/manual/stable/#options works here. Examples:
#
# fullscreen=yes
# save-position-on-quit=yes
# hwdec=nvdec                 # force NVIDIA NVDEC instead of auto-safe
# gpu-api=vulkan
# audio-device=wasapi/{...}   # run `mpv --audio-device=help` to list
# alang=en,eng                # preferred audio language for multi-track files
# screenshot-directory=D:/Screens
