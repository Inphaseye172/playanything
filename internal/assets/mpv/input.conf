# PlayAnything key bindings (on top of mpv's defaults: https://mpv.io/manual/stable/#keyboard-control)
# Managed file: rewritten on upgrade. Add your own bindings in user-input.conf? No —
# mpv has a single input.conf, so copy this file to keep your changes and set
# use_system_mpv_config in config.json, or just edit here (changes are lost on upgrade).

# Audio tracks (multi-track NVIDIA ShadowPlay/OBS recordings, dual-language files)
a           cycle audio                       # next audio track
A           cycle audio down                  # previous audio track
#           cycle audio
Ctrl+a      script-message pa-show-tracks     # list all tracks on screen

# Subtitles
s           cycle sub
S           cycle sub down
v           cycle sub-visibility

# Screenshots
Ctrl+s      screenshot                        # with subtitles
Alt+s       screenshot video                  # clean frame

# Photos / RAW previews: rotate, zoom, step through the folder
r           cycle-values video-rotate 90 180 270 0
R           cycle-values video-rotate 270 180 90 0
Ctrl+WHEEL_UP    add video-zoom 0.1
Ctrl+WHEEL_DOWN  add video-zoom -0.1
0           set video-zoom 0 ; set video-pan-x 0 ; set video-pan-y 0
PGDWN       playlist-next
PGUP        playlist-prev
MBTN_FORWARD playlist-next
MBTN_BACK    playlist-prev

# Playback
SPACE       cycle pause
MBTN_LEFT_DBL cycle fullscreen
ENTER       cycle fullscreen
f           cycle fullscreen
.           frame-step
,           frame-back-step
[           multiply speed 1/1.1
]           multiply speed 1.1
BS          set speed 1.0
l           ab-loop

# Troubleshooting helpers
Ctrl+h      cycle-values hwdec auto-safe no   # toggle GPU decoding
i           script-binding stats/display-stats-toggle
I           script-binding stats/display-page-2   # frame timings
d           cycle deinterlace
