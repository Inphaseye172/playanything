name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  # Pure-Go binary: no cgo anywhere. Also avoids Go/clang external-linking
  # problems on the macOS runners (dyld "missing LC_UUID").
  CGO_ENABLED: "0"

jobs:
  test:
    name: Test (Linux, with real mpv)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false
      - name: Install mpv, libmpv and ffmpeg for integration tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mpv libmpv2 ffmpeg
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)" || (gofmt -l cmd internal; exit 1)
      - run: go vet ./...
      - name: go test (the race detector needs cgo; shipped binaries stay pure Go)
        run: go test -race ./...
        env:
          CGO_ENABLED: "1"

  cross:
    name: Cross-compile all targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false
      - run: make cross
      - uses: actions/upload-artifact@v4
        with:
          name: playanything-dev-builds
          path: dist/

  scripts:
    name: Lint installers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: sudo apt-get install -y -qq shellcheck && shellcheck -s sh install/*.sh
      - name: PowerShell syntax
        shell: pwsh
        run: |
          foreach ($f in (Get-ChildItem install/*.ps1 | ForEach-Object FullName)) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.ToString() }; exit 1 }
            Write-Host "parsed $f OK"
          }

  windows:
    name: Build & smoke test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false
      - run: go test ./internal/media ./internal/rawpreview ./internal/cloud ./internal/config ./internal/assets ./internal/red
      - name: Build the release flavour (GUI subsystem, icon + manifest embedded)
        run: |
          go run github.com/akavel/rsrc@v0.10.2 -ico assets/icon/playanything.ico -manifest cmd/playanything/playanything.manifest -arch amd64 -o cmd/playanything/rsrc_windows_amd64.syso
          go build -ldflags "-H windowsgui" -o playanything-gui.exe ./cmd/playanything
      - name: Build a console flavour for the smoke test
        run: go build -o playanything.exe ./cmd/playanything
      - name: Smoke test CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\playanything.exe version
          if ((.\playanything.exe extensions).Split(' ').Count -lt 200) { throw "extension list too short" }
          .\playanything.exe setup
          .\playanything.exe config daemon never
          .\playanything.exe info README.md

  macos:
    name: Build & test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false
      - run: go test ./...
      - run: go build -o playanything ./cmd/playanything && ./playanything version
